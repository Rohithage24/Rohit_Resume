<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rohit Gajanan Hage – Resume</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #E4E7EC;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #16213A;
  }
  .toolbar {
    position: sticky;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.7rem 1.25rem;
    background: #fff;
    border-bottom: 1px solid #CDD3DE;
  }
  .file strong { display: block; font-size: 0.98rem; }
  .file span { font-size: 0.82rem; color: #5A6478; }
  .btn {
    display: inline-block;
    padding: 0.6rem 1.1rem;
    background: #2B44D9;
    color: #fff;
    font-weight: 650;
    font-size: 0.95rem;
    text-decoration: none;
    border-radius: 8px;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:focus-visible { outline: 3px solid #2B44D9; outline-offset: 3px; }
  .stage { padding: 2rem 1rem 3rem; }
  .sheet {
    display: block;
    width: 100%;
    max-width: 880px;
    height: auto;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #C5CBD6;
    box-shadow: 0 6px 24px rgba(10, 16, 32, 0.18);
  }
</style>
</head>
<body>

  <div class="toolbar">
    <div class="file">
      <strong>Rohit_Resume_19-09-2026.pdf</strong>
      <span>1 page · A4</span>
    </div>
    <a class="btn" href="Rohit_Resume_19-09-2026.pdf" download>Download PDF</a>
  </div>

  <main class="stage">
    <img class="sheet" src="resume.png"
         alt="Resume of Rohit Gajanan Hage, Full Stack MERN Developer">
  </main>

</body>
</html>
